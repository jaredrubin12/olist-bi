name: olist
version: "1.0.0"
config-version: 2

# Must match the top-level key in profiles.yml.
profile: olist

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: target
clean-targets: [target, dbt_packages]

# Layer defaults. Views are cheap and always fresh; marts are tables because
# dashboards query them repeatedly. Each layer gets its own DuckDB schema.
models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
