version: 2

models:
  - name: dim_dates
    description: One row per calendar day, 2016-01-01 to 2018-12-31.
    columns:
      - name: date_day
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: day_of_week
        description: ISO day of week, 1 = Monday … 7 = Sunday.
      - name: is_weekend
        description: True on Saturday and Sunday.

  - name: dim_products
    description: One row per product, with a never-null readable category (DQ-3).
    columns:
      - name: product_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: category
        description: English category name, else Portuguese, else 'unknown'. Use this in reports.
        data_tests:
          - not_null
      - name: category_name_pt
        description: Original Portuguese category (null for 610 products).

  - name: dim_sellers
    description: One row per seller, with location for maps.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: latitude
        description: Zip-level latitude. Null where unknown (DQ-4, DQ-8).
      - name: longitude
        description: Zip-level longitude. Null where unknown (DQ-4, DQ-8).

  - name: dim_customers
    description: >
      One row per real person (customer_unique_id), DQ-5. Location is from the
      person's most recent order. Order history counts only countable orders
      (all except canceled/unavailable, per docs/data-model.md).
    columns:
      - name: customer_unique_id
        description: Primary key. The actual person.
        data_tests:
          - unique
          - not_null
      - name: first_order_at
        description: First countable order. Null if the person only has canceled/unavailable orders.
      - name: last_order_at
        description: Most recent countable order.
      - name: lifetime_orders
        description: Number of countable orders.
        data_tests:
          - not_null
      - name: is_repeat_customer
        description: True if the person has 2 or more countable orders.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      One row per order, including canceled ones. For agreed metrics, filter
      on is_countable for Orders and sum revenue for Revenue (docs/data-model.md).
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: The person who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: purchase_date
        description: Date the order was placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: is_countable
        description: True for every status except canceled and unavailable. Defines the Orders metric.
        data_tests:
          - not_null
      - name: items_value
        description: Sum of item prices (BRL), all statuses. 0 if no items.
      - name: freight_value
        description: Sum of freight (BRL). 0 if no items.
      - name: revenue
        description: Agreed Revenue. items_value on countable orders, else 0. Excludes freight.
        data_tests:
          - not_null
      - name: order_value
        description: items_value + freight_value. What the customer was charged.
      - name: payment_total
        description: Total paid (BRL). Null for the 1 order with no payment record.
      - name: payment_vs_order_diff
        description: payment_total − order_value. Non-zero for ~249 orders; kept for reconciliation.
      - name: primary_payment_type
        description: Payment method covering the largest amount.
      - name: has_review
        description: True if the order has at least one review.
      - name: review_score
        description: Latest review score, 1–5. Null if no review.
      - name: is_delivered
        description: True if the order has a customer delivery date.
      - name: days_to_deliver
        description: Days from purchase to customer delivery.
      - name: days_late
        description: Delivery date minus estimated date, in days. Negative = early.
      - name: is_on_time
        description: Delivered on or before the estimated date. Null if not delivered. Defines the On-time rate metric.

  - name: fct_order_items
    description: One row per item within an order. Use for product, category and seller analysis.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        description: Foreign key to fct_orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: Foreign key to dim_products.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: Foreign key to dim_sellers.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_unique_id
        description: Foreign key to dim_customers.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: purchase_date
        description: Foreign key to dim_dates.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: item_price
        description: Item price (BRL), excluding freight.
      - name: revenue
        description: Agreed Revenue. item_price on countable orders, else 0.
        data_tests:
          - not_null
