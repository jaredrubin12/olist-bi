version: 2

models:
  - name: stg_olist__orders
    description: One row per order, with clean column names and explicit types.
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customers (per-order ID, see DQ-5).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        description: Current lifecycle status of the order.
        data_tests:
          - accepted_values:
              arguments:
                values: [created, approved, invoiced, processing, shipped, delivered, canceled, unavailable]
      - name: purchased_at
        description: When the customer placed the order.
        data_tests:
          - not_null
      - name: approved_at
        description: When payment was approved. Null if never approved.
      - name: delivered_to_carrier_at
        description: When the seller handed the order to the logistics carrier.
      - name: delivered_to_customer_at
        description: When the customer received the order. Null if not yet delivered.
      - name: estimated_delivery_date
        description: Delivery date promised to the customer at purchase. Compare with delivered_to_customer_at for on-time rate.

  - name: stg_olist__order_items
    description: One row per item within an order. Grain is order_id + order_item_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        description: Foreign key to orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: order_item_id
        description: Item sequence number within the order (1, 2, 3…).
        data_tests:
          - not_null
      - name: product_id
        description: Foreign key to products.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        description: Foreign key to sellers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: item_price
        description: Item price in BRL, excluding freight.
        data_tests:
          - not_null
      - name: freight_value
        description: Shipping cost allocated to this item, in BRL.
      - name: shipping_deadline_at
        description: Deadline for the seller to hand the item to the carrier.

  - name: stg_olist__order_payments
    description: One row per payment against an order. Grain is order_id + payment_sequential.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        description: Foreign key to orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_sequential
        description: Payment sequence number within the order.
      - name: payment_type
        description: How the customer paid. not_defined is a known, accepted value (DQ-7).
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_installments
        description: Number of installments the payment is split into.
      - name: payment_value
        description: Amount paid in BRL.
        data_tests:
          - not_null

  - name: stg_olist__order_reviews
    description: >
      One row per review per order. Grain is review_id + order_id, because
      review_id alone is not unique (DQ-1).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
    columns:
      - name: review_id
        description: Survey response ID. Not unique on its own.
        data_tests:
          - not_null
      - name: order_id
        description: Foreign key to orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: review_score
        description: Rating from 1 (worst) to 5 (best).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: review_title
        description: Optional comment title (Portuguese). Mostly null.
      - name: review_message
        description: Optional comment text (Portuguese).
      - name: survey_sent_at
        description: When the satisfaction survey was sent to the customer.
      - name: survey_answered_at
        description: When the customer answered the survey.

  - name: stg_olist__customers
    description: >
      One row per customer_id. Note customer_id is created per order (DQ-5);
      use customer_unique_id to count people or find repeat buyers.
    columns:
      - name: customer_id
        description: Primary key. Links to orders.
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: The actual person. Repeats across that person's orders.
        data_tests:
          - not_null
      - name: zip_code_prefix
        description: First 5 digits of the customer's zip code (text, keeps leading zeros).
      - name: city
        description: Customer city (lowercase, as in source).
      - name: state
        description: Two-letter Brazilian state code (UF).
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]

  - name: stg_olist__sellers
    description: One row per seller on the marketplace.
    columns:
      - name: seller_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: zip_code_prefix
        description: First 5 digits of the seller's zip code.
      - name: city
        description: Seller city.
      - name: state
        description: Two-letter Brazilian state code (UF).
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]

  - name: stg_olist__products
    description: One row per product. Category is Portuguese; English name is added downstream (DQ-3).
    columns:
      - name: product_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: category_name_pt
        description: Category in Portuguese. Null for 610 products (DQ-3).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__product_category_translations')
                field: category_name_pt
              config:
                severity: warn  # known gap: 2 categories lack a translation (DQ-3)
      - name: name_length
        description: Character count of the product name on the listing.
      - name: description_length
        description: Character count of the product description.
      - name: photo_count
        description: Number of product photos on the listing.
      - name: weight_g
        description: Weight in grams.
      - name: length_cm
        description: Package length in cm.
      - name: height_cm
        description: Package height in cm.
      - name: width_cm
        description: Package width in cm.

  - name: stg_olist__product_category_translations
    description: Lookup from Portuguese to English category names.
    columns:
      - name: category_name_pt
        description: Primary key (Portuguese name).
        data_tests:
          - unique
          - not_null
      - name: category_name_en
        description: English category name.
        data_tests:
          - not_null

  - name: stg_olist__geolocation
    description: >
      Coordinates by zip-code prefix. Multiple rows per prefix (DQ-2): never
      join to this directly; use the per-prefix intermediate model.
    columns:
      - name: zip_code_prefix
        description: First 5 digits of a Brazilian zip code. NOT unique in this model.
        data_tests:
          - not_null
      - name: latitude
        description: Latitude in decimal degrees.
      - name: longitude
        description: Longitude in decimal degrees.
      - name: city
        description: City name (inconsistent spelling/accents in source).
      - name: state
        description: Two-letter Brazilian state code (UF).
